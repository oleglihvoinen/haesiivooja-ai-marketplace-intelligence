name: Generate architecture PNG

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_architecture.py'
      - '.github/workflows/generate-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/generate_architecture.py
      - name: Validate PNG
        run: |
          python - <<'PY'
          from PIL import Image
          p = "docs/architecture.png"
          with Image.open(p) as img:
              img.verify()
          with Image.open(p) as img:
              assert img.format == "PNG"
              assert img.size == (1800, 1080)
          print("Validated", p)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.png
          if git diff --cached --quiet; then
            echo "Architecture PNG already current"
            exit 0
          fi
          git commit -m "Generate verified colored architecture PNG"
          git push
